# Control for the confound in configs/claude.toml: there the separate checker (Sonnet 5.5) is both a
# different model and a stronger one. Here the checker is a different model of about the maker's
# strength: gpt-oss-20b solved 72% of the novel tasks first try, Haiku 4.5 67%.
# The maker's settings are identical to configs/claude.toml. Run variant C only:
#     python -m trustme run --config configs/peer-check.toml --variants C --only novel --name peer-check-2026-11-16

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
min_interval_s = 10.0

[roles.maker]          # as in configs/claude.toml
provider = "anthropic"
model = "claude-haiku-4-5"

[roles.checker]        # a different model of similar strength, with the settings it was calibrated at
provider = "groq"
model = "openai/gpt-oss-20b"
reasoning_effort = "low"
temperature = 1.0      # gpt-oss's recommended setting
max_tokens = 1536      # Groq's free tier counts this cap against its tokens-per-minute limit

[run]
max_iters = 5
samples = 2
stop_when_unchanged = true
max_calls = 400
max_tokens = 8000      # the maker's cap, as in configs/claude.toml
