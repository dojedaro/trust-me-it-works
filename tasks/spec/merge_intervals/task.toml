id = "merge_intervals"
room = "spec"
tier = "novel"
title = '''Merge half-open intervals'''
signature = '''def merge_intervals(intervals: list) -> list[tuple[int, int]]'''
prompt = '''
Write `merge_intervals(intervals)` that returns the union of `intervals`. Each interval is a pair
(start, end) of integers for the half-open range start <= x < end. Return a sorted list of tuples in which
no two intervals overlap or touch: intervals that overlap or touch, like (1, 3) and (3, 5), become one.
An interval with end <= start is empty and contributes nothing. The input may be in any order, may hold
lists or tuples, and must not be modified.
'''
trap = '''Half-open ranges that touch must merge (strict < misses (1,3)+(3,5)), empty and reversed intervals must be dropped rather than merged, containment must not shrink the result, and sorting in place modifies the caller's list.'''

[[examples]]
call = '''merge_intervals([(1, 3), (2, 4)])'''
result = '''[(1, 4)]'''

[[examples]]
call = '''merge_intervals([(5, 6), (1, 2)])'''
result = '''[(1, 2), (5, 6)]'''
